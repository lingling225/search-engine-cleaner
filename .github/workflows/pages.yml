name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ac-baidu/doc/package-lock.json

      - name: Check userscript syntax
        run: node --check Search-Engine-Cleaner.user.js

      - name: Install dependencies
        working-directory: ac-baidu/doc
        run: npm ci

      - name: Run complete userscript contracts
        run: node --test tests/*.test.mjs

      - name: Type-check configuration site
        working-directory: ac-baidu/doc
        run: npm run type-check

      - name: Check Baidu Less styles
        working-directory: ac-baidu/doc
        run: npm run check:styles

      - name: Build configuration site
        working-directory: ac-baidu/doc
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ac-baidu/doc/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
